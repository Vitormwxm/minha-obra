plugins { id 'com.android.application' }

def firebaseFile = providers.gradleProperty('minhaObraFirebaseFile').map { rootProject.file(it) }.orNull
def firebaseResources = [:]
if (firebaseFile != null) {
    if (!firebaseFile.isFile()) {
        throw new GradleException('O arquivo de configuração Firebase informado não existe.')
    }
    def firebase
    try {
        firebase = new groovy.json.JsonSlurper().parse(firebaseFile)
    } catch (Exception ignored) {
        throw new GradleException('O arquivo de configuração Firebase precisa ser um JSON válido.')
    }
    def client = firebase.client?.find { it.client_info?.android_client_info?.package_name == 'br.com.minhaobra.app' }
    firebaseResources = [
        google_app_id: client?.client_info?.mobilesdk_app_id,
        gcm_defaultSenderId: firebase.project_info?.project_number,
        project_id: firebase.project_info?.project_id,
        google_api_key: client?.api_key?.find()?.current_key,
    ]
    if (firebaseResources.values().any { !(it instanceof String) || it.isBlank() }) {
        throw new GradleException('A configuração Firebase precisa conter o app br.com.minhaobra.app.')
    }
}

def minhaObraHost = providers.gradleProperty('minhaObraHost').orElse('focuslabapp.com').get().toLowerCase(Locale.ROOT)
if (minhaObraHost.length() > 253 || !minhaObraHost.matches('(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?')) {
    throw new GradleException('minhaObraHost must contain only a valid HTTPS domain, without a path or port.')
}

def signingFile = providers.gradleProperty('minhaObraSigningFile').map { rootProject.file(it) }.orNull
def signingValues = new Properties()
def signingStore = null
if (signingFile != null) {
    if (!signingFile.isFile()) {
        throw new GradleException('O arquivo privado de assinatura informado não existe.')
    }
    signingFile.withInputStream { signingValues.load(it) }
    if (['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { signingValues.getProperty(it)?.isBlank() != false }) {
        throw new GradleException('Complete os campos obrigatórios no arquivo privado de assinatura.')
    }
    signingStore = signingFile.parentFile.toPath().resolve(signingValues.getProperty('storeFile')).normalize().toFile()
    if (!signingStore.isFile()) {
        throw new GradleException('O arquivo de chaves indicado em storeFile não existe.')
    }
}

android {
    namespace 'br.com.minhaobra.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.minhaobra.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'
        firebaseResources.each { key, value -> resValue 'string', key, value }
        buildConfigField 'String', 'APP_HOST', '"' + minhaObraHost + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        if (signingStore != null) {
            release {
                storeFile signingStore
                storePassword signingValues.getProperty('storePassword')
                keyAlias signingValues.getProperty('keyAlias')
                keyPassword signingValues.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingStore != null) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'com.google.firebase:firebase-messaging:25.0.2'
}

def webAssetsDir = rootProject.file('../frontend/dist/minha-obra/browser')

tasks.register('verifyWebAssets') {
    group = 'verification'
    description = 'Requires the Angular production build before packaging Android.'
    doLast {
        if (!new File(webAssetsDir, 'index.html').isFile()) {
            throw new GradleException('Angular assets missing. Run npm ci and npm run build in frontend/ first.')
        }
    }
}

tasks.register('syncWebAssets', Sync) {
    dependsOn 'verifyWebAssets'
    from webAssetsDir
    into layout.projectDirectory.dir('src/main/assets')
}

tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }

tasks.register('requireReleaseSigning') {
    group = 'verification'
    description = 'Requires the original signing key for a release build.'
    doLast {
        if (signingStore == null) {
            throw new GradleException('Informe -PminhaObraSigningFile com o caminho do arquivo privado de assinatura.')
        }
    }
}
tasks.matching { it.name == 'packageRelease' || it.name == 'packageReleaseBundle' }.configureEach {
    dependsOn 'requireReleaseSigning'
}
