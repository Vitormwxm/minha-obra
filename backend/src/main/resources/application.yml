spring:
  application:
    name: minha-obra-backend
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
      initialization-fail-timeout: 5000
      schema: minhaobra
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: minhaobra
    default-schema: minhaobra
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
    listener:
      ack-mode: record
      missing-topics-fatal: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
