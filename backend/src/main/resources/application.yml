spring:
  application:
    name: minha-obra-backend
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
      initialization-fail-timeout: 5000
      schema: minhaobra
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: minhaobra
    default-schema: minhaobra
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    validate-migration-naming: true
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
    listener:
      ack-mode: record
      missing-topics-fatal: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

app:
  auth:
    encryption-key: ${APP_TOTP_ENCRYPTION_KEY:}
    secure-cookies: false
  events:
    enabled: ${APP_EVENTS_ENABLED:false}
  push:
    enabled: ${APP_PUSH_ENABLED:false}
    project-id: ${APP_PUSH_PROJECT_ID:}
    credentials-file: ${APP_PUSH_CREDENTIALS_FILE:}

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: MINHAOBRA_SESSION
        http-only: true
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
