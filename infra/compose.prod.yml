name: minha-obra

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:18.6-alpine@sha256:300ebd02c6d4de9ee27ad7f6855d5d21b4d3a4a5117767c1197d284c635d9736
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 80
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: minhaobra
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Configure POSTGRES_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - max_wal_size=256MB
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/010-create-app.sh:/docker-entrypoint-initdb.d/010-create-app.sh:ro
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  kafka:
    image: apache/kafka:4.4.0@sha256:76af3d0116abbb33b4cd964af410d4921c33d1f663e7a95d5453a9c35a84869b
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 640m
    pids_limit: 160
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Configure KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_NUM_PARTITIONS: '1'
      KAFKA_NUM_NETWORK_THREADS: '1'
      KAFKA_NUM_IO_THREADS: '2'
      KAFKA_BACKGROUND_THREADS: '2'
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: '16777216'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: '24'
      KAFKA_LOG_RETENTION_BYTES: '67108864'
      KAFKA_LOG_SEGMENT_BYTES: '16777216'
      KAFKA_MESSAGE_MAX_BYTES: '1048576'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', "KAFKA_HEAP_OPTS='-Xms16m -Xmx64m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?Use a imagem aprovada identificada por digest}
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 640m
    pids_limit: 160
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/minhaobra
      SPRING_DATASOURCE_USERNAME: minhaobra
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_TOTP_ENCRYPTION_KEY: ${APP_TOTP_ENCRYPTION_KEY:?Inicialize a chave privada de autenticação}
      APP_EVENTS_ENABLED: 'true'
      SERVER_TOMCAT_THREADS_MAX: '16'
      SERVER_TOMCAT_THREADS_MIN_SPARE: '2'
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:+ExitOnOutOfMemoryError
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [edge, data]
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health/readiness']
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?Use a imagem aprovada identificada por digest}
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 64m
    pids_limit: 40
    security_opt: [no-new-privileges:true]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Configure APP_DOMAIN}
      NGINX_ENVSUBST_FILTER: ^APP_DOMAIN$
    depends_on:
      backend:
        condition: service_healthy
    ports: ['80:80', '443:443']
    volumes:
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks: [edge]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/nginx-health']
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

volumes:
  postgres_data:
  kafka_data:

networks:
  edge:
  data:
    internal: true
